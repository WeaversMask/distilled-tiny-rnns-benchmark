name: Tests

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notebook verification tests read pinned commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install CPU and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install -e '.[test]'

      - name: Run the CPU smoke experiment
        run: python -m distilled_rnns.cli --config configs/smoke.json --output outputs/smoke --device cpu

      - name: Run the test suite
        run: python -m pytest -q
